spring:
  application:
    name: content-ranking-system

  datasource:
    url: jdbc:mysql://localhost:3308/rankingdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: dev
    password: dev1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

server:
  port: 8081

jwt:
  secret: Y29udGVudC1yYW5raW5nLXN5c3RlbS1sb2NhbC1kZXYtc2VjcmV0LWtleS0yMDI2
  expiration-millis: 3600000

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace